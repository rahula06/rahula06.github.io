---
layout: default
---
<article class="blog-post">
  <header class="page-heading"><a class="back-link" href="{{ '/blog/' | relative_url }}">← All posts</a><p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p><h1>{{ page.title | escape }}</h1>{% if page.description %}<p>{{ page.description | escape }}</p>{% endif %}</header>
  <div class="prose">{{ content }}</div>
</article>
