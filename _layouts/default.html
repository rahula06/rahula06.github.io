<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#fbfaf7">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.github.build_revision }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% if site.url != '' %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
  {% feed_meta %}
  {% if page.math %}
  <script>window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']]}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header shell">
    <a class="wordmark" href="{{ '/' | relative_url }}">Rahul Arvind</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.section == 'home' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/publications/' | relative_url }}" {% if page.section == 'publications' %}aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.section == 'blog' %}aria-current="page"{% endif %}>Blog</a>
    </nav>
  </header>
  <main id="main" class="shell">{{ content }}</main>
  <footer class="site-footer shell">
    <div class="footer-links">
      {% if site.email != '' %}<a href="mailto:{{ site.email | escape }}">Email</a>{% endif %}
      {% if site.github_url != '' %}<a href="{{ site.github_url | escape }}">GitHub</a>{% endif %}
      {% if site.scholar_url != '' %}<a href="{{ site.scholar_url | escape }}">Google Scholar</a>{% endif %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>
</body>
</html>
