---
section: home
---
<section class="publications-section home-work" aria-label="My work">
  <h2>My work</h2>
  <ol class="home-pub-list">
    {% for paper in site.data.publications %}
      <li><a href="{{ '/publications/' | relative_url }}#paper-{{ paper.arxiv | replace: '.', '-' }}">{{ paper.title | escape }}</a></li>
    {% endfor %}
  </ol>
</section>
