---
section: home
---
<section class="work-section">
  <h1>My work</h1>
  <ul class="pub-title-list">
    {% for paper in site.data.publications %}
      <li>
        <a href="{{ '/publications/' | relative_url }}#paper-{{ paper.arxiv | replace: '.', '-' }}">
          {{ paper.title | escape }}
        </a>
      </li>
    {% endfor %}
  </ul>
</section>
